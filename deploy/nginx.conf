# Replace example.com with your domain. Run Certbot after enabling this HTTP site.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    client_max_body_size 6m;

    location = /admin {
        auth_basic "Site administration";
        auth_basic_user_file /etc/nginx/akmalm07.htpasswd;
        proxy_pass http://127.0.0.1:5050;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /api/admin/ {
        auth_basic "Site administration";
        auth_basic_user_file /etc/nginx/akmalm07.htpasswd;
        proxy_pass http://127.0.0.1:5050;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:5050;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
